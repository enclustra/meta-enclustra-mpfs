# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-enclustra-mpfs"
BBFILE_PATTERN_meta-enclustra-mpfs = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-enclustra-mpfs = "7"

LAYERDEPENDS_meta-enclustra-mpfs += "meta-polarfire-soc-bsp"

LAYERSERIES_COMPAT_meta-enclustra-mpfs = "kirkstone"
