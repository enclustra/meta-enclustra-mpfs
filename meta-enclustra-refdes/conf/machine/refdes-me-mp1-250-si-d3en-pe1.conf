#@TYPE: Machine
#@NAME: refdes-me-mp1-250-si-d3en-pe1
#@SOC: Polarfire SoC
#@DESCRIPTION: Machine configuration for the Enclustra MP1 module

MACHINEOVERRIDES =. "${@['', 'refdes-me-mp1-250-si-d3en-pe1:']['refdes-me-mp1-250-si-d3en-pe1' !='${MACHINE}']}"

require conf/machine/me-mp1-250-si-d3en.conf
require conf/machine/me-pe1-generic.conf

WKS_FILE ?= "enclustra-mercury-mp1.wks"
IMAGE_FSTYPES:append = " wic wic.gz"

## Do not update fstab file when using wic images
WIC_CREATE_EXTRA_ARGS ?= "--no-fstab-update"

WKS_FILE_DEPENDS ?= " \
    u-boot-mchp \
    e2fsprogs-native \
    bmap-tools-native \
"

IMAGE_BOOT_FILES ?= " \
    fitImage \
    boot.scr \
"
