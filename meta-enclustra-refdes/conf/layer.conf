# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-enclustra-refdes"
BBFILE_PATTERN_meta-enclustra-refdes = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-enclustra-refdes = "8"

LAYERDEPENDS_meta-enclustra-refdes += "meta-enclustra-mpfs"

LAYERSERIES_COMPAT_meta-enclustra-refdes = "kirkstone"
